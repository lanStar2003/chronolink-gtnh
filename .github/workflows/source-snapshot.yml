name: Source snapshot
on:
  push:
    branches: [work/network-v2-completion]
    paths: [.github/workflows/source-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive only tracked project source
        run: |
          mkdir -p snapshot
          git archive --format=zip --output=snapshot/chronolink-source.zip HEAD
          git rev-parse HEAD > snapshot/COMMIT.txt
          sha256sum snapshot/chronolink-source.zip > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-snapshot-${{ github.run_id }}
          path: snapshot/
          if-no-files-found: error
          retention-days: 7
